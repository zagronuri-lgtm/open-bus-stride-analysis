name: Automation - quarterly ridership

# Source of truth: prompts/automation/03_quarterly_ridership.md
# --check-only exits 0 = unchanged (skip), 1 = new resource available (fetch).
on:
  schedule:
    # 02:40 UTC ≈ 05:40 Israel, on the 1st of every 3rd month.
    - cron: '40 2 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ridership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compute date (Asia/Jerusalem)
        run: echo "TODAY=$(TZ=Asia/Jerusalem date +%F)" >> "$GITHUB_ENV"

      - name: Check, fetch ridership and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/quarterly-ridership/${TODAY}"
          git checkout -B "$BRANCH"

          set +e
          python -m src.ridership_fetch --check-only
          CHECK_STATUS=$?
          set -e

          if [ "$CHECK_STATUS" -eq 0 ]; then
            echo "Ridership resource unchanged; skipping PR."
            exit 0
          fi
          if [ "$CHECK_STATUS" -ne 1 ]; then
            echo "Ridership check failed with status ${CHECK_STATUS}."
            exit "$CHECK_STATUS"
          fi

          python -m src.ridership_fetch
          python -m pytest -q tests/test_ridership_fetch.py

          git add data/raw/ridership_*.csv
          git add -f data/cache/ridership_meta.json
          if git diff --cached --quiet; then
            echo "Ridership fetch produced no tracked changes; skipping PR."
            exit 0
          fi

          LATEST="$(ls -t data/raw/ridership_*.csv | head -1)"
          PERIOD="$(basename "$LATEST" .csv | sed 's/^ridership_//')"

          git commit -m "data: update ridership ${PERIOD}"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "Ridership update: ${PERIOD}" \
            --body "Automated data.gov.il ridership update for ${PERIOD}." \
            || echo "PR already exists for ${BRANCH}; updated branch."
