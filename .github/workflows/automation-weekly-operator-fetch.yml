name: Automation - weekly operator fetch

# Source of truth: prompts/automation/01_weekly_operator_fetch.md
on:
  schedule:
    # GitHub cron is UTC. 03:20 UTC ≈ 06:20 Sunday in Israel (UTC+3 summer / 05:20 winter).
    - cron: '20 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compute dates (Asia/Jerusalem)
        run: |
          echo "TODAY=$(TZ=Asia/Jerusalem date +%F)" >> "$GITHUB_ENV"
          echo "DATE_TO=$(TZ=Asia/Jerusalem date -d 'yesterday' +%F)" >> "$GITHUB_ENV"
          echo "DATE_FROM=$(TZ=Asia/Jerusalem date -d '7 days ago' +%F)" >> "$GITHUB_ENV"

      - name: Run weekly operator fetch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/operator-weekly-fetch/${TODAY}"
          OUT="data/raw/operator_weekly_${DATE_FROM}_${DATE_TO}.csv"

          git checkout -B "$BRANCH"
          python -m src.operator_weekly_fetch --date-from "$DATE_FROM" --date-to "$DATE_TO" --out "$OUT"
          python -m pytest -q tests/test_open_bus_stride_client.py

          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No weekly operator fetch changes; skipping PR."
            exit 0
          fi

          git commit -m "data: update weekly operator fetch ${DATE_FROM} to ${DATE_TO}"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "Weekly operator fetch: ${DATE_FROM} to ${DATE_TO}" \
            --body "Automated weekly Open Bus Stride operator fetch for ${DATE_FROM} to ${DATE_TO}." \
            || echo "PR already exists for ${BRANCH}; updated branch."
