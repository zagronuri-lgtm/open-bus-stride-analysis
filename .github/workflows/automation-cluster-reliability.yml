name: Automation - cluster reliability

# Source of truth: prompts/automation/02_daily_cluster_reliability.md
# Service date = yesterday in Asia/Jerusalem. Sun-Thu service dates => runs Mon-Fri.
# Thursday service date produces the weekly summary inside the runner.
on:
  schedule:
    # 04:00 UTC ≈ 07:00 Israel (UTC+3 summer). 1-5 = Mon-Fri.
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compute dates (Asia/Jerusalem)
        run: |
          echo "TODAY=$(TZ=Asia/Jerusalem date +%F)" >> "$GITHUB_ENV"
          echo "SERVICE_DATE=$(TZ=Asia/Jerusalem date -d 'yesterday' +%F)" >> "$GITHUB_ENV"

      - name: Run cluster reliability and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/cluster-reliability/${SERVICE_DATE}"
          git checkout -B "$BRANCH"

          python -m src.cluster_reliability_runner \
            --manifest data/reference/metropoline_line_ids.csv \
            --service-date "$SERVICE_DATE" \
            --output-dir data/output/reliability
          python -m pytest -q tests/test_cluster_reliability_runner.py tests/test_line_reliability_analyzer.py tests/test_exclusions_calendar.py

          git add -f data/output/reliability
          if git diff --cached --quiet; then
            echo "No cluster reliability changes; skipping PR."
            exit 0
          fi

          git commit -m "data: update cluster reliability for ${SERVICE_DATE}"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "Cluster reliability: ${SERVICE_DATE}" \
            --body "Automated Metropoline cluster reliability run for service date ${SERVICE_DATE}." \
            || echo "PR already exists for ${BRANCH}; updated branch."
