name: Weekly Non-Execution Report

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          mkdir -p outputs
          python -m src.weekly_report --output-dir outputs
          echo "REPORT_FILE=$(ls -t outputs/*.xlsx | head -n1)" >> "$GITHUB_ENV"
          echo "REPORT_TAG=weekly-$(date +%F)" >> "$GITHUB_ENV"

      - name: Publish as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REPORT_TAG }}
          name: "Weekly report ${{ env.REPORT_TAG }}"
          files: ${{ env.REPORT_FILE }}
