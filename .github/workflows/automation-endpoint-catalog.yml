name: Automation - endpoint catalog

# Source of truth: prompts/automation/04_daily_endpoint_catalog.md
on:
  schedule:
    # 02:00 UTC ≈ 05:00 Israel, daily.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compute date (Asia/Jerusalem)
        run: echo "TODAY=$(TZ=Asia/Jerusalem date +%F)" >> "$GITHUB_ENV"

      - name: Rebuild endpoint catalog and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/endpoint-catalog/${TODAY}"
          git checkout -B "$BRANCH"

          python -m src.endpoint_catalog
          python -m pytest -q tests/test_endpoint_catalog.py

          git add docs/endpoint_catalog.csv docs/endpoint_catalog.md docs/endpoint_catalog.html
          if git diff --cached --quiet; then
            echo "Endpoint catalog unchanged; skipping PR."
            exit 0
          fi

          git commit -m "docs: update endpoint catalog ${TODAY}"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "Endpoint catalog update: ${TODAY}" \
            --body "Automated OpenAPI endpoint catalog refresh for ${TODAY}." \
            || echo "PR already exists for ${BRANCH}; updated branch."
